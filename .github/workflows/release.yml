name: release

# A `v*` tag is the whole act of releasing: the tag is checked against Cargo.toml, the commit is
# checked like any PR, built for the 4 platforms, smoke-tested, attested and published. Nothing
# is published unless every earlier job passed, and a published release is immutable.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  # The tag without its `v` must be the version in Cargo.toml.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clio-memory") | .version')
          if [ "${TAG#v}" != "$crate" ]; then
            echo "::error::the tag is $TAG but Cargo.toml says version $crate"
            exit 1
          fi

  # The same checks as ci.yml, on the tagged commit.
  check:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add "${{ matrix.target }}"
      # Linux binaries are built against glibc 2.28 (the `.2.28` suffix) so they start on old
      # distributions; ONNX Runtime is a glibc library, so musl is not an option.
      - if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - if: matrix.zigbuild
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-zigbuild
      - name: Build (Linux, glibc 2.28)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --features model2vec,granite --target "${{ matrix.target }}.2.28"
      - name: Build (macOS)
        if: "!matrix.zigbuild"
        run: cargo build --release --locked --features model2vec,granite --target "${{ matrix.target }}"
      - name: Name the binary as its asset
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/clio-memory" "dist/clio-memory-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clio-memory-${{ matrix.target }}
          path: dist/clio-memory-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Each binary runs where it can: `--version` must be the tag, Linux must not need a glibc newer
  # than 2.28, and a throwaway install with install.sh must put a working binary in place.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            install: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            install: true
          - target: aarch64-apple-darwin
            os: macos-latest
            install: true
          # Runs only if the runner can execute x86_64 code (Rosetta). install.sh would pick the
          # arm64 binary under Rosetta, so this leg checks `--version` only.
          - target: x86_64-apple-darwin
            os: macos-latest
            install: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clio-memory-*
          path: dist
          merge-multiple: true
      - name: Can this runner execute the binary?
        id: can
        run: |
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 true 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### ${{ matrix.target }}: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "This runner cannot execute x86_64 code (\`arch -x86_64 true\` failed), so the Intel macOS binary was built but not run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: --version is the tag
        if: steps.can.outputs.run == 'true'
        run: |
          chmod +x dist/clio-memory-*
          bin="dist/clio-memory-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            got=$(arch -x86_64 "$bin" --version)
          else
            got=$("$bin" --version)
          fi
          echo "$got"
          [ "$got" = "clio-memory ${TAG#v}" ] || { echo "::error::expected 'clio-memory ${TAG#v}'"; exit 1; }
      - name: Linux needs glibc 2.28 or older
        if: steps.can.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          max=$(objdump -T "dist/clio-memory-${{ matrix.target }}" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "highest glibc symbol: ${max:-none}"
          [ -n "$max" ] || { echo "::error::no GLIBC_ symbols found: is this a glibc binary?"; exit 1; }
          top=$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)
          [ "$top" = GLIBC_2.28 ] || { echo "::error::needs $max, more than GLIBC_2.28"; exit 1; }
      # install.sh against the freshly built files: the same layout as a release page.
      - name: Test install with install.sh
        if: steps.can.outputs.run == 'true' && matrix.install
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum clio-memory-* > SHA256SUMS; else shasum -a 256 clio-memory-* > SHA256SUMS; fi
          cd ..
          mkdir -p "dist-url/download/$TAG"
          cp dist/clio-memory-* dist/SHA256SUMS "dist-url/download/$TAG/"
          CLIO_MEMORY_DOWNLOAD_URL="file://$PWD/dist-url" \
          CLIO_MEMORY_VERSION="$TAG" \
          CLIO_MEMORY_SKIP_ATTESTATION=1 \
          CLIO_MEMORY_HAND_OVER=0 \
            sh install.sh
          got=$("$HOME/.local/bin/clio-memory" --version)
          echo "$got"
          [ "$got" = "clio-memory ${TAG#v}" ] || { echo "::error::the installed binary says '$got'"; exit 1; }

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clio-memory-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum clio-memory-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/clio-memory-*
      # Not a draft: with immutable releases a published release can no longer change.
      - name: Publish the release
        working-directory: dist
        run: gh release create "$TAG" clio-memory-* SHA256SUMS --title "$TAG" --generate-notes --verify-tag
