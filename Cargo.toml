[package]
name = "clio-memory"
description = "An agent's own memory on one SQLite file: global, local, shared with Clio."
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/i-montes/clio-memory"

[features]
# The binary's own parts: the `setup` screen, and serde_json's `preserve_order` so the agents'
# config files it edits keep their key order. A program that only uses the library (Clio) takes
# the crate with `default-features = false` and pulls none of them; cargo unifies features, so
# `preserve_order` from the library would change how that whole program writes JSON.
default = ["cli"]
cli = ["dep:cliclack", "dep:console", "serde_json/preserve_order"]
telemetry = ["dep:tracing"]
model2vec = ["dep:model2vec-rs"]
# Granite Embedding 311M through the ONNX Runtime installed on the machine (loaded at run time:
# nothing is downloaded at build time); CUDA when the runtime has it, else the CPU.
granite = ["dep:ort", "dep:tokenizers"]

[dependencies]
# No `hf-hub`: this crate never downloads models; it only reads a local directory.
model2vec-rs = { version = "0.3.0", default-features = false, features = ["fancy-regex"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "api-22"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only with the `telemetry` feature; no attribute macros, no subscriber: the host program picks those.
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
# The `setup` screen of the binary (prompts on stderr) and its colors; console is the one cliclack
# draws with, so the theme's styles are its type.
cliclack = { version = "0.5.7", optional = true }
console = { version = "0.16.6", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[dev-dependencies]
tempfile = "3.27.0"
# The telemetry tests record spans with a subscriber written in the test itself.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-core = "0.1"

[[bin]]
name = "clio-memory"
path = "src/bin/clio-memory/main.rs"
required-features = ["cli"]

[[example]]
name = "granite_time"
required-features = ["granite"]

[[example]]
name = "relations_floor"
required-features = ["granite"]
